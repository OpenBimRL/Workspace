services:
  openbimrl-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
      args:
        # Host `docker` group GID (NixOS default here: 131). Override via
        # .devcontainer/devcontainer.json build.args or DOCKER_GID env.
        DOCKER_GID: ${DOCKER_GID:-131}
        # RUB campus mirror by default; set UBUNTU_APT_MIRROR= (empty) to use archive.ubuntu.com.
        UBUNTU_APT_MIRROR: ${UBUNTU_APT_MIRROR-http://linux.rub.de/ubuntu/}
    container_name: openbimrl-dev
    working_dir: /workspace/openbimrl
    command: sleep infinity
    volumes:
      - .:/workspace/openbimrl:cached
      - ./.m2:/home/vscode/.m2
      - openbimrl-node-modules:/workspace/openbimrl/OpenBimRL-CreatorTool/webapp/node_modules
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      USER_NAME: ${USER_NAME:-}
      ACCESS_TOKEN: ${ACCESS_TOKEN:-}
      DOCKER_HOST: unix:///var/run/docker.sock
      JAVA_HOME: /opt/jetbrains-jbr
    ports:
      - "8000:8000"
      - "8080:8080"
    devices:
      - /dev/kfd:/dev/kfd
      - /dev/dri:/dev/dri
    security_opt:
      - seccomp=unconfined
    # LLDB attach: SYS_PTRACE is enough in-container. yama.ptrace_scope is host-global
    # (not namespaced) — set on the host, e.g. sudo sysctl kernel.yama.ptrace_scope=0
    cap_add:
      - SYS_PTRACE
    group_add:
      - video
      - docker
#      - render
    init: true
    tty: true
    logging:
      driver: json-file
      options:
        max-size: "10m"

volumes:
  openbimrl-node-modules:
